name: 3D Studio CI

on:
  pull_request:
    paths:
      - "tools/3d-studio/**"
      - ".github/workflows/3d-studio-ci.yml"
  push:
    branches:
      - 3d-studio-mcp-mvp
    paths:
      - "tools/3d-studio/**"
      - ".github/workflows/3d-studio-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/3d-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
